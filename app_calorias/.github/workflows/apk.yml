# Testa e monta o APK. Em todo PR, só confere; no merge na main, publica uma
# versão nova (Releases) com o APK, para baixar no celular e instalar por cima.
name: APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Recriar a chave de assinatura
        # A chave fica no segredo ASSINATURA_JKS (o arquivo em base64), nunca no repositório público.
        env:
          ASSINATURA_JKS: ${{ secrets.ASSINATURA_JKS }}
        run: |
          if [ -z "$ASSINATURA_JKS" ]; then echo "::error::Falta o segredo ASSINATURA_JKS"; exit 1; fi
          printf '%s' "$ASSINATURA_JKS" | base64 -d > app/assinatura.jks

      - name: Montar o APK
        # O número da execução vira o número da versão: cada APK novo instala por cima do anterior.
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: ./gradlew assembleRelease -PnumeroVersao=${{ github.run_number }} --stacktrace

      - name: Conferir a tabela TACO dentro do APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if unzip -l "$apk" | grep -q "assets/taco.json"; then
            echo "TACO no APK: $(unzip -p "$apk" assets/taco.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') alimentos"
          else
            echo "::warning::APK sem a tabela TACO (rode o workflow TACO)."
          fi

      - name: Publicar a versão
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Calorias-$versao.apk"
          gh release create "v$versao" "Calorias-$versao.apk" \
            --title "Calorias $versao" \
            --notes "Baixe o arquivo Calorias-$versao.apk no celular e toque nele para instalar por cima da versão anterior. Os dados do diário continuam."

      - name: Guardar o APK do PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: calorias-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
