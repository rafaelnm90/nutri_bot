name: Deploy NutriBot

on:
  # À mão: como mudança só neste arquivo não dispara o deploy, ele roda por aqui.
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    # O app de calorias (app_calorias) é independente do bot: mudança só nele,
    # nos workflows dele ou neste arquivo não reinicia o bot no servidor.
    paths-ignore:
      - app_calorias/**
      - .github/workflows/app_calorias_*.yml
      - .github/workflows/deploy.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar Servidor Oracle via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/nutri_bot
            git fetch --all
            git reset --hard origin/main
            
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Limpeza cirúrgica e reinício
            sudo systemctl stop nutri_bot.service || true
            sudo systemctl kill -s SIGKILL nutri_bot.service || true
            sudo systemctl start nutri_bot.service
